name: build-and-test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Prepare pinned WinSpd SDK
        shell: pwsh
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP 'winspd-sdk'
          New-Item -ItemType Directory -Force "$sdk/inc/winspd", "$sdk/lib", "$sdk/extracted" | Out-Null
          Invoke-WebRequest https://github.com/winfsp/winspd/releases/download/v1.0B1/winspd-1.0.20357.msi -OutFile "$sdk/winspd.msi"
          if ((Get-FileHash "$sdk/winspd.msi" -Algorithm SHA256).Hash -ne 'F1157EEF805DCBEC78A477F2B4EE5ABC0049C8A9329444E5D18CAB01D3604265') { throw 'WinSpd package hash mismatch' }
          & 'C:/Program Files/7-Zip/7z.exe' e "$sdk/winspd.msi" "-o$sdk/extracted" -y | Out-Null
          if ($LASTEXITCODE) { throw 'MSI extraction failed' }
          Copy-Item "$sdk/extracted/winspd_x64.lib" "$sdk/lib/"
          foreach ($name in @('winspd.h','ioctl.h')) {
            Invoke-WebRequest "https://raw.githubusercontent.com/winfsp/winspd/55c53bc454afbbba38bd1692f52beb77ed59142f/inc/winspd/$name" -OutFile "$sdk/inc/winspd/$name"
          }
          "WINSPD_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          Copy-Item "$sdk/extracted/winspd_x64.dll" "$sdk/lib/winspd-x64.dll"
          "$sdk/lib" | Out-File -FilePath $env:GITHUB_PATH -Append
      - run: cargo test --locked --release --features winspd,vendored-openssl
      - run: cargo build --locked --release --features winspd,vendored-openssl
      - name: Build isolated G0 spike and oracle harness
        shell: pwsh
        run: |
          cl /nologo /W4 /I "$env:WINSPD_SDK/inc" native/g0.c native/winspd_shim.c /Fe:winluks-g0.exe /link /LIBPATH:"$env:WINSPD_SDK/lib" winspd_x64.lib ole32.lib advapi32.lib
          if ($LASTEXITCODE) { throw 'G0 build failed' }
          cargo build --locked --release --examples --features vendored-openssl
          if ($LASTEXITCODE) { throw 'oracle build failed' }
      - name: Test native close and publication boundaries
        shell: pwsh
        run: |
          cl /nologo /W4 /I "$env:WINSPD_SDK/inc" native/tests/close.c /Fe:native-close-test.exe /link advapi32.lib ole32.lib
          if ($LASTEXITCODE) { throw 'Native test build failed' }
          ./native-close-test.exe
          if ($LASTEXITCODE) { throw 'Native close tests failed' }
      - name: Package test build
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/winluks2.exe, LICENSE, docs/THIRD_PARTY.md dist/
          # MSI stream identifiers use underscores; the PE import name uses a hyphen.
          Copy-Item "$env:WINSPD_SDK/extracted/winspd_x64.dll" dist/winspd-x64.dll
          Copy-Item winluks-g0.exe, target/release/examples/oracle.exe, target/release/examples/rw_oracle.exe dist/
          Copy-Item third_party/WinSpd-LICENSE.txt dist/
          @(
            "Application source and build scripts: https://github.com/DPS0340/winluks/tree/$env:GITHUB_SHA",
            'WinSpd corresponding source: https://github.com/winfsp/winspd/archive/55c53bc454afbbba38bd1692f52beb77ed59142f.zip',
            'Rust dependency and vendored OpenSSL source versions are fixed by Cargo.lock; fetch them with cargo vendor --locked.'
          ) | Set-Content dist/SOURCES.txt
          $hashes = Get-ChildItem dist -File | Where-Object Name -ne 'SHA256.txt' | Get-FileHash -Algorithm SHA256
          $hashes | ForEach-Object { '{0}  {1}' -f $_.Hash.ToLowerInvariant(), (Split-Path $_.Path -Leaf) } | Set-Content dist/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: winluks-windows-x64-experimental
          path: dist/
